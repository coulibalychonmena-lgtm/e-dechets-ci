<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Déchets CI | Signalement 🇨🇮</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --vert: #0d4a1f;
            --vert-light: #1b7a35;
            --orange: #ff6b00;
            --orange-light: #ff9800;
            --gris: #f0f4f0;
            --blanc: #ffffff;
            --texte: #1a2e1a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            background: var(--gris);
            overflow: hidden; /* Empêche le défilement de la page entière sur mobile */
            height: 100vh;
            color: var(--texte);
        }

        /* === ENTÊTE (HEADER) === */
        header {
            background: var(--vert);
            color: white;
            padding: 0 16px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        header .logo { font-family: 'Syne', sans-serif; font-size: 18px; }
        header .logo span { color: var(--orange-light); }

        .header-badge {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        /* === ZONE DE LA CARTE === */
        #map {
            height: calc(100vh - 56px - 80px); /* Hauteur totale moins header et barre de navigation */
            width: 100%;
            z-index: 1;
            background: #cbd2d0;
        }

        /* === BARRE DE NAVIGATION BASSE === */
        .nav-bar {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-top: 1px solid #e0e8e0;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 9999;
            padding: 0 20px;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
            color: white;
            border: none;
            padding: 0 30px;
            height: 52px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            flex: 1;
            box-shadow: 0 4px 20px rgba(255,107,0,0.4);
            cursor: pointer;
        }

        /* === ÉCRAN DE CHARGEMENT === */
        .loading {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(13,74,31,0.95);
            z-index: 15000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loading.active { display: flex; }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--orange-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === MODAL DU FORMULAIRE === */
        .overlay {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        .modal {
            background: white;
            margin: 10px auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            max-height: 95vh;
            overflow-y: auto;
        }

        .preview-img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
        .gps-info { font-size: 11px; background: #f0f4f0; padding: 8px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--vert-light); }
        .form-group { margin-bottom: 10px; }
        .form-label { display: block; font-size: 10px; font-weight: 600; color: #666; margin-bottom: 3px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1.5px solid #e0e8e0; border-radius: 8px; font-size: 14px; }
        .btn-submit { width: 100%; background: var(--vert); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        /* === TOAST (NOTIFICATION) === */
        .toast {
            display: none; position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--vert); color: white; padding: 12px 24px; border-radius: 50px; font-size: 13px; z-index: 20001;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>

<header>
    <div class="logo">E-Déchets <span>CI</span></div>
    <div class="header-badge">🇨🇮 CÔTE D'IVOIRE</div>
</header>

<div id="map"></div>

<div class="nav-bar">
    <button class="main-btn" onclick="document.getElementById('camera-file').click()">
        📷 PHOTOGRAPHIER UN DÉCHET
    </button>
</div>

<input type="file" id="camera-file" accept="image/*" capture="environment" style="display:none">

<div id="form-modal" class="overlay">
    <div class="modal">
        <h3 style="color:var(--vert); font-family:'Syne'; margin-top:0;">Détails du Signalement</h3>
        <img id="img-preview" class="preview-img" src="">
        <div id="address-display" class="gps-info">📍 Localisation en cours...</div>

        <div class="form-group">
            <label class="form-label">Type de déchet</label>
            <select id="node-type">
                <option value="Informatique">💻 Informatique / Mobile</option>
                <option value="Batteries">🔋 Piles / Batteries</option>
                <option value="Electromenager">📺 Électroménager</option>
                <option value="Autre">📦 Autre e-déchet</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Nom du lieu / Point de repère</label>
            <input type="text" id="node-name" placeholder="Ex: Face à la station Pétroci...">
        </div>

        <div class="form-group">
            <label class="form-label">Votre Contact (Optionnel)</label>
            <input type="text" id="user-contact" placeholder="N° WhatsApp ou Email">
        </div>

        <button id="submit-btn" class="btn-submit">ENVOYER LE SIGNALEMENT</button>
        <button class="btn-cancel" style="width:100%; background:none; border:none; color:#aaa; font-size:12px; padding:10px; cursor:pointer;" onclick="location.reload()">ANNULER</button>
    </div>
</div>

<div id="loading-screen" class="loading">
    <div class="spinner"></div>
    <p style="color:white; margin-top:10px;">Traitement...</p>
</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    // Importation des modules Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCx78sbB4rxfF24tzooTUWPrZcOOGWDL8xk",
        authDomain: "e-dechets-ci.firebaseapp.com",
        projectId: "e-dechets-ci",
        appId: "1:921449360134:web:db17f6d1f285ecddfa8c87"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "points_collecte");

    // === CONFIGURATION DE LA CARTE (RESTRICTION CÔTE D'IVOIRE) ===
    const ciBounds = L.latLngBounds(
        L.latLng(4.30, -8.60), // Sud-Ouest
        L.latLng(10.74, -2.48) // Nord-Est
    );

    const map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false,
        maxBounds: ciBounds,        // Limite la zone de déplacement
        maxBoundsViscosity: 1.0,    // Force le blocage aux frontières
        minZoom: 7                  // Empêche de trop dézoomer
    }).setView([5.3484, -4.0305], 11); // Centré sur Abidjan au départ

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        bounds: ciBounds
    }).addTo(map);

    // Affichage des marqueurs existants en temps réel
    const markers = {};
    onSnapshot(colRef, (snap) => {
        snap.forEach((docDb) => {
            const d = docDb.data();
            if (!d.lat || !d.lng || markers[docDb.id]) return;
            
            // Couleur du point selon le type
            const color = d.type === 'Batteries' ? '#ff9800' : '#1b7a35';
            const icon = L.divIcon({
                html: `<div style="background:${color};width:10px;height:10px;border-radius:50%;border:2px solid white;"></div>`,
                className: '', iconSize: [10, 10]
            });
            markers[docDb.id] = L.marker([d.lat, d.lng], { icon }).addTo(map);
        });
    });

    let currentCoords = null;
    let compressedImage = null;
    let currentAddress = "";

    // Fonction pour réduire le poids de l'image (indispensable pour Firebase Free)
    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 800; // Taille max 800px
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.6)); // Qualité 60%
                };
            };
        });
    }

    // Gestion du clic caméra
    document.getElementById('camera-file').onchange = async (e) => {
        if (!e.target.files.length) return;
        document.getElementById('loading-screen').classList.add('active');
        
        try {
            // 1. Compression
            compressedImage = await compressImage(e.target.files[0]);
            document.getElementById('img-preview').src = compressedImage;

            // 2. Géolocalisation
            const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000 });
            });

            currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            
            // 3. Vérification si l'utilisateur est bien en Côte d'Ivoire
            if (!ciBounds.contains([currentCoords.lat, currentCoords.lng])) {
                alert("Désolé, vous devez être en Côte d'Ivoire pour faire un signalement.");
                location.reload();
                return;
            }

            map.setView([currentCoords.lat, currentCoords.lng], 16);

            // 4. Récupération de l'adresse (Reverse Geocoding)
            const resAddr = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${currentCoords.lat}&lon=${currentCoords.lng}&format=json`);
            const dataAddr = await resAddr.json();
            currentAddress = dataAddr.display_name || "Lieu détecté en Côte d'Ivoire";

            document.getElementById('address-display').innerHTML = `📍 <b>Secteur :</b> ${currentAddress.split(',').slice(0,2).join(',')}`;
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('form-modal').style.display = 'block';
        } catch (err) {
            document.getElementById('loading-screen').classList.remove('active');
            alert("Erreur : Veuillez activer le GPS et autoriser l'accès.");
        }
    };

    // Envoi du formulaire à Firebase
    document.getElementById('submit-btn').onclick = async () => {
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = 'Envoi...';

        try {
            await addDoc(colRef, {
                lat: currentCoords.lat,
                lng: currentCoords.lng,
                adresse: currentAddress,
                contact: document.getElementById('user-contact').value || "Anonyme",
                nom: document.getElementById('node-name').value || "Non précisé",
                type: document.getElementById('node-type').value,
                photo: compressedImage,
                date: serverTimestamp()
            });

            const toast = document.getElementById('toast');
            toast.innerText = "✅ Signalement réussi ! Merci.";
            toast.classList.add('show');
            setTimeout(() => location.reload(), 2500);
        } catch (err) {
            btn.disabled = false;
            alert("Erreur de connexion lors de l'envoi.");
        }
    };
</script>

</body>
</html>
