<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ADMIN | E-Déchets CI 🇨🇮</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rouge: #c0392b; --vert: #27ae60; --bleu: #2980b9; --orange: #e67e22; --violet: #8e44ad;
            --dark: #0f1923; --card-bg: #1a2535; --text-light: rgba(255,255,255,0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--dark); color: var(--text-light); overflow-x: hidden; }

        header {
            background: linear-gradient(135deg, #1a0a0a 0%, var(--rouge) 100%);
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 1000;
        }

        /* === STATS RÉDUITES === */
        .stats-section { 
            padding: 10px; background: #111c2a; 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; 
        }
        .stat-card { 
            background: var(--card-bg); padding: 8px; border-radius: 8px; 
            text-align: center; border-bottom: 3px solid #ccc;
        }
        .stat-number { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; display: block; }
        .stat-label { font-size: 8px; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.5px; }

        /* === CARTE === */
        #map { height: 70vh; width: 100%; background: #0b1118; }

        /* === POPUP === */
        .admin-popup { width: 180px; color: #333; }
        .admin-popup img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
        .btn-action {
            display: block; width: 100%; padding: 8px; margin-top: 5px;
            border-radius: 4px; text-align: center; font-weight: 700;
            text-decoration: none; border: none; cursor: pointer; font-size: 10px;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1 style="font-family:'Syne'; font-size:14px;">🛠️ ADMIN E-DÉCHETS</h1>
    </div>
    <div style="font-size:10px; font-weight:600;">🇨🇮 CI-ONLY MODE</div>
</header>

<div class="stats-section">
    <div class="stat-card" style="border-color: #fff;">
        <span class="stat-label">Total</span>
        <span class="stat-number" id="s-all">0</span>
    </div>
    <div class="stat-card" style="border-color: var(--bleu);">
        <span class="stat-label">Inform.</span>
        <span class="stat-number" id="s-info">0</span>
    </div>
    <div class="stat-card" style="border-color: var(--orange);">
        <span class="stat-label">Batterie</span>
        <span class="stat-number" id="s-batt">0</span>
    </div>
    <div class="stat-card" style="border-color: var(--violet);">
        <span class="stat-label">Électro.</span>
        <span class="stat-number" id="s-elec">0</span>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCx78sbB4rxfF24tzooTUWPrZcOOGWDL8xk",
        authDomain: "e-dechets-ci.firebaseapp.com",
        projectId: "e-dechets-ci",
        appId: "1:921449360134:web:db17f6d1f285ecddfa8c87"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- CONFIGURATION CARTE LIMITÉE À LA CI ---
    // Limites approximatives de la Côte d'Ivoire (Sud-Ouest / Nord-Est)
    const ciBounds = L.latLngBounds(
        L.latLng(4.3, -8.6), // Bas gauche
        L.latLng(10.8, -2.4) // Haut droit
    );

    const map = L.map('map', {
        center: [5.3484, -4.0305], // Centré sur Abidjan
        zoom: 11,
        minZoom: 7,
        maxBounds: ciBounds, // Bloque la sortie du pays
        maxBoundsViscosity: 1.0 // Empêche le rebond élastique hors limites
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        bounds: ciBounds
    }).addTo(map);

    window.marquerCollecte = async (id) => {
        if(confirm("Confirmer la collecte ?")) {
            await deleteDoc(doc(db, "points_collecte", id));
        }
    };

    onSnapshot(query(collection(db, "points_collecte"), orderBy("date", "desc")), (snap) => {
        let stats = { all: 0, info: 0, batt: 0, elec: 0 };
        map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });

        snap.forEach((docSnap) => {
            const d = docSnap.data();
            const id = docSnap.id;
            const type = (d.type || "").toLowerCase();

            stats.all++;
            if(type.includes("info")) stats.info++;
            else if(type.includes("batt")) stats.batt++;
            else stats.elec++;

            if(d.lat && d.lng) {
                const marker = L.marker([d.lat, d.lng]).addTo(map);
                marker.bindPopup(`
                    <div class="admin-popup">
                        ${d.photo ? `<img src="${d.photo}">` : ""}
                        <strong style="font-size:12px;">${d.type}</strong><br>
                        <small>📧 ${d.email || 'N/A'}</small>
                        <a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" class="btn-action" style="background:var(--bleu); color:white;">📍 GPS</a>
                        <button onclick="marquerCollecte('${id}')" class="btn-action" style="background:var(--vert); color:white;">✅ COLLECTÉ</button>
                    </div>
                `);
            }
        });

        document.getElementById('s-all').innerText = stats.all;
        document.getElementById('s-info').innerText = stats.info;
        document.getElementById('s-batt').innerText = stats.batt;
        document.getElementById('s-elec').innerText = stats.elec;
    });
</script>

</body>
</html>
